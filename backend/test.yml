config:
  target: "http://localhost:4000"
  phases:
    - duration: 60
      arrivalRate: 1000

scenarios:
  - flow:
      - post:
          url: "/api/login"
          json:
            username: "test"
            password: "test"
      - get:
          url: "/api/employee"
      - get:
          url: "/api/schedules"
      - get:
          url: "/api/logout"
      - get:
          url: "/api/coordinators"
      - get:
          url: "/api/administrators"
      - get:
          url: "/api/teams"
      - get:
          url: "/api/permissions"
      - get:
          url: "/api/justifications"
      - get:
          url: "/api/users"
      - get:
          url: "/api/profile"
      - post:
          url: "/api/registerEmployees"
          json:
            name: "Empleado Test"
      - post:
          url: "/api/registerAdministrators"
          json:
            name: "Admin Test"
      - post:
          url: "/api/registerCoordinators"
          json:
            name: "Coordinador Test"
      - post:
          url: "/api/recoveryPassword"
          json:
            email: "test@example.com"
      - post:
          url: "/api/forcePasswordUpdate"
          json:
            password: "newpass"